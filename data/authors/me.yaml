bio: |
  Songwu Luo is a legal scholar specializing in medical law, bioethics, and comparative health policy. His first-author research has been published in leading JCR Q1 SSCI journals, including BMC Medical Ethics and Frontiers in Public Health, alongside seven KCI core articles. Bridging clinical nursing and legal doctrine, Songwu is dedicated to advancing patient autonomy and end-of-life decision-making frameworks.

